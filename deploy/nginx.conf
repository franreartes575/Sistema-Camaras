# Alternativa a Caddy: nginx como proxy TLS delante del sistema.
# Incluir dentro del bloque `http { ... }` de nginx.
#
# Lo esencial:
#   - X-Forwarded-For se SOBRESCRIBE con $remote_addr (la IP real). Nunca uses
#     $proxy_add_x_forwarded_for acá: agregaría al final lo que mandó el
#     cliente y le permitiría elegir con qué IP queda en la auditoría.
#   - Todo el sitio va por HTTPS; HTTP sólo redirige.
#   - El backend (8000) y el frontend (3000) escuchan sólo en 127.0.0.1.

# Primera barrera contra floods al login (la segunda es la del backend, que
# cuenta fallos por IP y por usuario en la auditoría).
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
# Tope general de la API por IP. Holgado para el uso normal (el Inicio
# dispara varias lecturas juntas: de ahí la ráfaga); frena floods antes de
# que lleguen a Python. Los límites finos por endpoint siguen en el backend.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_status 429;

server {
    listen 80;
    server_name camaras.ejemplo.gob.ar;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name camaras.ejemplo.gob.ar;

    ssl_certificate     /etc/ssl/camaras/fullchain.pem;
    ssl_certificate_key /etc/ssl/camaras/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Un cliente que manda los encabezados o el cuerpo de a gotas (slowloris)
    # no retiene conexiones indefinidamente.
    client_header_timeout 10s;
    client_body_timeout   30s;

    # Cabeceras comunes hacia los dos servicios.
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP         "";

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000/auth/login;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        client_max_body_size 33m;
        # /optimize/ resuelve cada sede hasta su límite de tiempo y después
        # pide las polilíneas a OSRM: con el valor por defecto (60 s) nginx
        # cortaría un plan grande a la mitad.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # La barra final en proxy_pass quita el prefijo /api.
        proxy_pass http://127.0.0.1:8000/;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
